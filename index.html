<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>WhiteClub</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0f0f13;--bg2:#1a1a22;--bg3:#22222e;--bg4:#2a2a38;
  --text:#f0f0f0;--text2:#aaa;--text3:#555;
  --brd:#2a2a3a;--acc:#2d6a4f;--acc2:#40916c;
  --red:#ef4444;--grn:#22c55e;--gold:#f59e0b;--blue:#3b82f6;
  --msg-me:#2d6a4f;--msg-other:#22222e;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}

/* SCREENS */
.screen{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;transition:opacity .25s;overflow-y:auto}
.screen.off{opacity:0;pointer-events:none}
.logo{font-size:36px;font-weight:900;letter-spacing:-1.5px;color:var(--gold)}
.logo em{color:var(--text2);font-style:normal;font-weight:300}
.made{font-size:10px;color:var(--text3);letter-spacing:3px;text-transform:uppercase;margin-bottom:20px}
.card{background:var(--bg2);border:1px solid var(--brd);border-radius:20px;padding:28px;width:100%;max-width:360px}
.card-t{font-size:19px;font-weight:800;margin-bottom:4px}
.card-s{font-size:12px;color:var(--text2);margin-bottom:22px}
.inp{width:100%;padding:13px 16px;border:1px solid var(--brd);border-radius:12px;background:var(--bg3);color:var(--text);font-size:15px;outline:none;margin-bottom:10px;transition:border-color .2s}
.inp:focus{border-color:var(--acc2)}
.inp::placeholder{color:var(--text3)}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;margin-bottom:8px;transition:all .15s}
.btn:active{transform:scale(.97)}
.btn-acc{background:var(--acc);color:#fff}
.btn-acc:hover{background:var(--acc2)}
.btn-g{background:transparent;border:1px solid var(--brd);color:var(--text2)}
.btn-g:hover{border-color:#555;color:var(--text)}
.err{font-size:12px;color:var(--red);text-align:center;min-height:16px;margin-bottom:6px}
.choice-wrap{display:flex;flex-direction:column;gap:12px;width:100%;max-width:340px}
.choice{padding:20px 22px;border:1px solid var(--brd);border-radius:18px;background:var(--bg2);cursor:pointer;transition:all .2s;text-align:left}
.choice:hover{border-color:var(--acc2);background:var(--bg3)}
.choice:active{transform:scale(.98)}
.choice-ico{font-size:30px;margin-bottom:8px}
.choice-t{font-size:16px;font-weight:700}
.choice-s{font-size:12px;color:var(--text2);margin-top:3px}
.code-box{font-size:34px;font-weight:900;letter-spacing:10px;text-align:center;padding:18px;background:var(--bg3);border-radius:14px;border:1px solid var(--brd);cursor:pointer;margin:14px 0;color:var(--gold)}
.code-box:hover{background:var(--bg4)}
.code-hint{font-size:11px;color:var(--text3);text-align:center;margin-top:-8px;margin-bottom:14px}

/* ROOM */
#room{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .25s;background:var(--bg);overflow:hidden}
#room.on{opacity:1;pointer-events:all}

/* HEADER */
.room-head{flex-shrink:0;background:var(--bg2);border-bottom:1px solid var(--brd);padding:10px 16px;display:flex;flex-direction:column;gap:8px}
.room-title{font-size:17px;font-weight:900;color:var(--gold);text-align:center;letter-spacing:-.5px}
.room-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.room-code-wrap{display:flex;align-items:center;gap:6px}
.dot-live{width:8px;height:8px;border-radius:50%;background:var(--red);animation:pulse 1.5s infinite;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.room-code-lbl{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:1px}
.room-code-val{font-size:14px;font-weight:900;letter-spacing:4px;color:var(--gold)}
.head-btns{display:flex;gap:6px;margin-left:auto}
.hbtn{padding:6px 12px;border:1px solid var(--brd);border-radius:8px;background:none;color:var(--text2);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:4px}
.hbtn:hover{border-color:#555;color:var(--text)}
.hbtn:active{transform:scale(.96)}
.hbtn.red{border-color:var(--red);color:var(--red)}
.user-chips{display:flex;gap:6px;flex-wrap:wrap}
.uchip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;background:var(--bg3);border:1px solid var(--brd);font-size:12px;font-weight:600}
.uchip.is-host{border-color:rgba(245,158,11,.4);background:rgba(245,158,11,.08)}
.uchip.is-mod{border-color:rgba(59,130,246,.4);background:rgba(59,130,246,.08)}
.uavatar{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;flex-shrink:0;color:#fff}
.ubadge-sm{font-size:8px;padding:1px 5px;border-radius:4px;font-weight:700;text-transform:uppercase}
.ub-host{background:rgba(245,158,11,.2);color:var(--gold)}
.ub-mod{background:rgba(59,130,246,.2);color:var(--blue)}
.uact-sm{background:none;border:none;cursor:pointer;font-size:12px;padding:0 2px;color:var(--text3);line-height:1}
.uact-sm:hover{color:var(--red)}

/* ROOM BODY */
.room-body{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0}

/* VIDEO */
.vid-wrap{flex-shrink:0;background:#000;position:relative;width:100%;display:flex;justify-content:center;align-items:center}
.vid-wrap video{width:100%;max-width:860px;max-height:42vh;object-fit:contain;display:block}
@media(min-width:768px){.vid-wrap video{max-height:56vh}}

/* FAKE FULLSCREEN (mobil üçün) */
#room.fake-fs{z-index:999}
#room.fake-fs .room-head{display:none}
#room.fake-fs .vid-wrap{position:fixed;inset:0;z-index:1000;background:#000;max-height:none;justify-content:center;align-items:center}
#room.fake-fs .vid-wrap video{max-height:100vh;max-height:100dvh;max-width:100vw;width:100vw;height:100vh;height:100dvh}
#room.fake-fs .vid-wrap{height:100vh;height:100dvh}
#room.fake-fs .chat-area{display:none}

/* BUFFERING */
.buf-spin{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:44px;height:44px;border:3px solid rgba(255,255,255,.15);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:none;z-index:5}
.buf-spin.show{display:block}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}

/* DOUBLE TAP */
.dtap{position:absolute;top:0;bottom:56px;width:32%;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .2s;z-index:3}
.dtap.left{left:0;background:radial-gradient(ellipse at 20%,rgba(255,255,255,.1),transparent 70%)}
.dtap.right{right:0;background:radial-gradient(ellipse at 80%,rgba(255,255,255,.1),transparent 70%)}
.dtap.show{opacity:1}
.dtap-lbl{font-size:12px;font-weight:700;color:#fff;background:rgba(0,0,0,.5);padding:5px 12px;border-radius:16px}

/* VIDEO CONTROLS */
.vctrl{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.88));padding:0 12px 10px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:4}
.vid-wrap.cs .vctrl{opacity:1;pointer-events:all}
.prog-wrap{padding:10px 0 6px;cursor:pointer;touch-action:none;position:relative}
.prog-track{height:3px;background:rgba(255,255,255,.2);border-radius:3px;position:relative;transition:height .15s}
.prog-wrap:hover .prog-track,.prog-wrap.drag .prog-track{height:5px}
.prog-buf{position:absolute;top:0;left:0;height:100%;background:rgba(255,255,255,.3);border-radius:3px;pointer-events:none}
.prog-fill{position:absolute;top:0;left:0;height:100%;background:var(--gold);border-radius:3px;pointer-events:none}
.prog-thumb{position:absolute;top:50%;right:-6px;transform:translateY(-50%);width:13px;height:13px;border-radius:50%;background:var(--gold);opacity:0;transition:opacity .15s;pointer-events:none}
.prog-wrap:hover .prog-thumb,.prog-wrap.drag .prog-thumb{opacity:1}
.ctrl-row{display:flex;align-items:center;gap:1px}
.vbtn{background:none;border:none;color:#fff;cursor:pointer;padding:6px;border-radius:8px;transition:background .15s;display:flex;align-items:center;justify-content:center;min-width:36px;min-height:40px}
.vbtn:hover{background:rgba(255,255,255,.1)}
.vbtn:active{background:rgba(255,255,255,.2);transform:scale(.92)}
.vbtn svg{width:20px;height:20px;fill:currentColor}
.vtime{font-size:11px;color:rgba(255,255,255,.85);font-weight:600;white-space:nowrap;margin:0 3px}
.spacer{flex:1}
.speed-wrap{position:relative}
.speed-btn{font-size:11px;font-weight:700;min-width:auto;padding:6px 8px;letter-spacing:.3px}
.speed-menu{position:absolute;bottom:calc(100% + 6px);right:0;background:rgba(10,10,15,.98);border:1px solid var(--brd);border-radius:12px;padding:5px;min-width:96px;display:none;z-index:30;box-shadow:0 4px 20px rgba(0,0,0,.8)}
.speed-menu.open{display:block}
.speed-opt{padding:7px 12px;font-size:12px;font-weight:500;border-radius:7px;cursor:pointer;color:var(--text2);transition:background .15s}
.speed-opt:hover{background:var(--bg4);color:var(--text)}
.speed-opt.on{color:var(--gold);font-weight:700}
.vol-g{display:flex;align-items:center;gap:3px}
.vol-sl{width:0;overflow:hidden;accent-color:var(--gold);cursor:pointer;transition:width .2s}
.vol-g:hover .vol-sl,.vol-g:focus-within .vol-sl{width:52px}
.sync-b{font-size:9px;font-weight:700;padding:3px 7px;border-radius:5px;background:rgba(34,197,94,.15);color:var(--grn);border:1px solid rgba(34,197,94,.25);white-space:nowrap}
.sync-b.warn{background:rgba(245,158,11,.15);color:var(--gold);border-color:rgba(245,158,11,.3)}
.sync-b.bad{background:rgba(239,68,68,.15);color:var(--red);border-color:rgba(239,68,68,.3)}

/* TAP OVERLAY */
.tap-ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.5);cursor:pointer;z-index:6;gap:10px}
.tap-ov-ico{font-size:56px}
.tap-ov-lbl{font-size:15px;font-weight:700;color:#fff}

/* CHAT */
.chat-area{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0;background:var(--bg)}
.msgs{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:3px;scrollbar-width:thin;scrollbar-color:var(--brd) transparent}
.msg-row{display:flex;margin-bottom:2px}
.msg-row.me{justify-content:flex-end}
.msg-row.other{justify-content:flex-start}
.msg-row.sys{justify-content:center;margin:5px 0}
.bubble{max-width:75%;padding:7px 11px;border-radius:16px;font-size:13px;line-height:1.5;word-break:break-word}
.msg-row.me .bubble{background:var(--msg-me);color:#fff;border-bottom-right-radius:4px}
.msg-row.other .bubble{background:var(--msg-other);color:var(--text);border-bottom-left-radius:4px;border:1px solid var(--brd)}
.bubble-name{font-size:10px;font-weight:700;margin-bottom:2px}
.cn-h{color:var(--gold)}.cn-m{color:var(--blue)}.cn-u{color:var(--acc2)}
.bubble-time{font-size:10px;color:rgba(255,255,255,.35);margin-top:2px;text-align:right}
.msg-row.other .bubble-time{color:var(--text3)}
.sys-bubble{font-size:11px;color:var(--text3);background:var(--bg3);padding:3px 10px;border-radius:10px;border:1px solid var(--brd)}
.cinp-wrap{padding:9px 12px;border-top:1px solid var(--brd);display:flex;gap:8px;flex-shrink:0;background:var(--bg2)}
.cinp{flex:1;padding:10px 14px;border:1px solid var(--brd);border-radius:22px;background:var(--bg3);color:var(--text);font-size:14px;outline:none}
.cinp:focus{border-color:var(--acc2)}
.cinp::placeholder{color:var(--text3)}
.csend{padding:10px 18px;border:none;border-radius:22px;background:var(--acc);color:#fff;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap}
.csend:hover{background:var(--acc2)}
.csend:active{transform:scale(.96)}
.cinp:disabled,.csend:disabled{opacity:.3;cursor:not-allowed}
.muted-note{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);border-radius:8px;padding:7px;font-size:11px;color:var(--red);text-align:center;margin:4px 12px}

/* TOAST */
.toast{position:fixed;top:10px;left:50%;transform:translateX(-50%) translateY(-60px);background:rgba(15,15,20,.95);border:1px solid var(--brd);border-radius:10px;padding:9px 16px;font-size:12px;font-weight:600;z-index:500;opacity:0;transition:all .3s;white-space:nowrap;pointer-events:none;max-width:90vw;overflow:hidden;text-overflow:ellipsis;backdrop-filter:blur(10px);box-shadow:0 4px 20px rgba(0,0,0,.6)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* Chat notif */
.cnotif{position:fixed;bottom:76px;right:12px;background:var(--bg3);border:1px solid var(--brd);border-radius:10px;padding:7px 12px;font-size:12px;z-index:400;opacity:0;transition:all .25s;pointer-events:none;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;box-shadow:0 2px 12px rgba(0,0,0,.5)}
.cnotif.show{opacity:1}
/* Buffer info */
.buf-info{position:fixed;top:8px;left:50%;transform:translateX(-50%);background:rgba(15,15,20,.92);border:1px solid rgba(245,158,11,.3);border-radius:8px;padding:6px 14px;font-size:11px;font-weight:600;color:var(--gold);z-index:450;opacity:0;transition:opacity .3s;pointer-events:none;backdrop-filter:blur(8px);white-space:nowrap}
.buf-info.show{opacity:1}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="cnotif" id="cnotif"></div>
<div class="buf-info" id="buf-info"></div>

<!-- HOME -->
<div class="screen" id="scr-home">
  <div class="logo">White<em>Club</em></div>
  <div class="made">Mr. White tərəfindən hazırlanıb</div>
  <div class="choice-wrap">
    <button class="choice" onclick="go('scr-create')">
      <div class="choice-ico">🎬</div>
      <div class="choice-t">Otaq yarat</div>
      <div class="choice-s">Yeni izləmə otağı aç, dostunu dəvət et</div>
    </button>
    <button class="choice" onclick="go('scr-join')">
      <div class="choice-ico">🚪</div>
      <div class="choice-t">Otağa qoşul</div>
      <div class="choice-s">Dostunun otaq kodunu daxil et</div>
    </button>
  </div>
</div>

<!-- CREATE -->
<div class="screen off" id="scr-create">
  <div class="card">
    <div class="card-t">Otaq yarat</div>
    <div class="card-s">İzləmə otağını qur</div>
    <input class="inp" id="c-name" placeholder="Adın" maxlength="20">
    <input class="inp" id="c-url" placeholder="Video linki (MP4)" autocomplete="off">
    <div class="err" id="c-err"></div>
    <button class="btn btn-acc" onclick="doCreate()">Otaq yarat →</button>
    <button class="btn btn-g" onclick="go('scr-home')">← Geri</button>
  </div>
</div>

<!-- JOIN -->
<div class="screen off" id="scr-join">
  <div class="card">
    <div class="card-t">Otağa qoşul</div>
    <div class="card-s">Dostunun otaq kodunu daxil et</div>
    <input class="inp" id="j-name" placeholder="Adın" maxlength="20">
    <input class="inp" id="j-code" placeholder="AB3X9" maxlength="5"
      style="text-transform:uppercase;letter-spacing:6px;font-weight:800;font-size:22px;text-align:center;color:var(--gold)"
      oninput="this.value=this.value.toUpperCase()">
    <div class="err" id="j-err"></div>
    <button class="btn btn-acc" onclick="doJoin()">Qoşul →</button>
    <button class="btn btn-g" onclick="go('scr-home')">← Geri</button>
  </div>
</div>

<!-- WAIT -->
<div class="screen off" id="scr-wait">
  <div class="card" style="text-align:center">
    <div class="card-t" style="text-align:center">Otaq hazırdır! 🎉</div>
    <div class="card-s" style="text-align:center">Bu kodu dostuna göndər</div>
    <div class="code-box" id="show-code" onclick="copyCode()">-----</div>
    <div class="code-hint">Kopyalamaq üçün tıkla</div>
    <button class="btn btn-acc" onclick="enterRoom()">İzləməyə başla →</button>
    <button class="btn btn-g" onclick="cancelRoom()">Ləğv et</button>
  </div>
</div>

<!-- ROOM -->
<div id="room">
  <div class="room-head">
    <div class="room-title">WhiteClub</div>
    <div class="room-meta">
      <div class="room-code-wrap">
        <div class="dot-live"></div>
        <div class="room-code-lbl">OTAQ</div>
        <div class="room-code-val" id="rcode">-----</div>
      </div>
      <div class="head-btns">
        <button class="hbtn" onclick="copyCode()">📋 Kod</button>
        <button class="hbtn" onclick="copyLink()">🔗 Link</button>
        <button class="hbtn red" id="leave-btn" onclick="leaveRoom()">Çıx</button>
      </div>
    </div>
    <div class="user-chips" id="uchips"></div>
  </div>

  <div class="room-body">
    <div class="vid-wrap" id="vw">
      <video id="vid" preload="auto" playsinline webkit-playsinline x5-playsinline></video>
      <div class="buf-spin" id="bspin"></div>
      <div class="dtap left" id="dtl"><div class="dtap-lbl">⏪ -10s</div></div>
      <div class="dtap right" id="dtr"><div class="dtap-lbl">+10s ⏩</div></div>
      <div class="vctrl" id="vctrl">
        <div class="prog-wrap" id="pw">
          <div class="prog-track">
            <div class="prog-buf" id="pbuf" style="width:0%"></div>
            <div class="prog-fill" id="pfill" style="width:0%">
              <div class="prog-thumb"></div>
            </div>
          </div>
        </div>
        <div class="ctrl-row">
          <button class="vbtn" id="pbtn" onclick="togglePlay()"><svg id="pico" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
          <button class="vbtn" onclick="skip(-10)"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm.5 6 8.5 6V6z"/></svg></button>
          <button class="vbtn" onclick="skip(10)"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zm-8.5 6 8.5-6v12z"/></svg></button>
          <div class="vol-g">
            <button class="vbtn" onclick="toggleMuteVol()"><svg id="vico" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg></button>
            <input type="range" class="vol-sl" id="vsl" min="0" max="1" step="0.05" value="1" oninput="setVol(this.value)">
          </div>
          <div class="vtime" id="vt">0:00 / 0:00</div>
          <div class="spacer"></div>
          <div class="sync-b" id="sbadge">● CANLI</div>
          <div class="speed-wrap">
            <button class="vbtn speed-btn" id="splbl" onclick="toggleSM()">1×</button>
            <div class="speed-menu" id="smenu">
              <div class="speed-opt" onclick="setSpd(0.5)">0.5×</div>
              <div class="speed-opt" onclick="setSpd(0.75)">0.75×</div>
              <div class="speed-opt on" onclick="setSpd(1)">1×</div>
              <div class="speed-opt" onclick="setSpd(1.25)">1.25×</div>
              <div class="speed-opt" onclick="setSpd(1.5)">1.5×</div>
              <div class="speed-opt" onclick="setSpd(2)">2×</div>
            </div>
          </div>
          <!-- FULLSCREEN BTN -->
          <button class="vbtn" id="fsbtn" onclick="toggleFS()">
            <svg id="fsico" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
          </button>
        </div>
      </div>
    </div>

    <div class="chat-area">
      <div class="msgs" id="msgs"></div>
      <div id="mnote" class="muted-note" style="display:none">🔇 Siz susturuldunuz</div>
      <div class="cinp-wrap">
        <input class="cinp" id="cinp" placeholder="Mesaj yaz..." maxlength="200" onkeydown="if(event.key==='Enter')sendMsg()">
        <button class="csend" id="csend" onclick="sendMsg()">Göndər</button>
      </div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
'use strict';

function fmt(s){
  s=Math.floor(s||0);
  const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;
  const p=n=>n<10?'0'+n:''+n;
  return h>0?h+':'+p(m)+':'+p(sec):m+':'+p(sec);
}

// TOUCH
let lastTap=0,tapX=0,tapTm=null;
vw.addEventListener('touchend',e=>{
  if(isDrag)return;
  if(e.target.closest('.vctrl')&&vw.classList.contains('cs')){showCtrl(false);return;}
  const now=Date.now(),x=e.changedTouches[0].clientX,w=vw.offsetWidth;
  if(now-lastTap<280&&Math.abs(x-tapX)<100){
    clearTimeout(tapTm);
    if(x<w*.33)skipFlash(-10,'l');
    else if(x>w*.67)skipFlash(10,'r');
    else togglePlay();
  }else{tapTm=setTimeout(()=>showCtrl(false),10);}
  lastTap=now;tapX=x;
},{passive:true});

function skipFlash(s,side){
  skip(s);
  const el=$(side==='l'?'dtl':'dtr');
  el.classList.add('show');setTimeout(()=>el.classList.remove('show'),700);
}

// PROGRESS BAR
function getP(e){
  const r=pw.getBoundingClientRect();
  const x=(e.clientX!=null?e.clientX:e.touches?.[0]?.clientX??0)-r.left;
  return Math.max(0,Math.min(1,x/r.width));
}
function doSeek(pct){
  if(!canCtrl()){toast('Yalnız host/idarəçi idarə edə bilər');return;}
  const t=pct*(vid.duration||0);
  vid.currentTime=t;
  pushVid(!vid.paused,true);
}
pw.addEventListener('mousedown',e=>{isDrag=true;pw.classList.add('drag');doSeek(getP(e));e.preventDefault();});

  $('rcode').textContent=room.code;

  vid.src=room.url;vid.preload='auto';vid.load();vid.playbackRate=curSpd;

  const vl=vRef.on('value',snap=>{
    if(!snap.exists())return;
    const prev=lastDBState;
    lastDBState=snap.val();
    if(vidReady)applyVid(lastDBState,prev);
    else setTimeout(()=>{vidReady=true;if(lastDBState)applyVid(lastDBState,null);},1500);
  });

  // HOST HEARTBEAT — only updates time, not seeked flag
  if(me.host){
    const hb=setInterval(()=>{
      if(vRef&&vidReady&&!vid.paused){
        // Update time+at but keep seeked=false so guests don't show toast
        vRef.update({time:vid.currentTime,at:nowS(),seeked:false});

    },3000);

  }

  const ul=DB.ref('rooms/'+room.code+'/users').on('value',snap=>{
    const u=snap.val()||{};
    renderUsers(u);
    const my=u[me.id];

    const buf=Object.values(u).filter(x=>x.buffering&&x.id!==me.id).map(x=>x.name);
    buf.length?showBufInfo('⏳ '+buf.join(', ')+' gözləyir...'):hideBufInfo();
  });
  offs.push(()=>DB.ref('rooms/'+room.code+'/users').off('value',ul));

  const rl=rRef.on('value',snap=>{if(!snap.exists()&&!me.host){toast('🚫 Host otağı bitirdi',4000);setTimeout(()=>{cleanup();go('scr-home');},1500);}});
  offs.push(()=>rRef.off('value',rl));

  const cl=cRef.limitToLast(150).on('child_added',snap=>appendMsg(snap.val()));

  if(!me.host)cRef.push({sys:true,text:me.name+' otağa qoşuldu',ts:Date.now()});

  $('room').classList.add('on');go('__none__');

function bindVideoEvents(){
  if(vidBound)return;vidBound=true;
  vid.addEventListener('waiting',()=>{
    $('bspin').classList.add('show');
    if(uRef)uRef.child('buffering').set(true);
    if(me.host){
      clearTimeout(bufferingTimer);
      bufferingTimer=setTimeout(()=>{
        if(vid.readyState<3&&!vid.paused){vid.pause();pushVid(false,false);toast('⏸ Yüklənir...');}
      },2000);
    }
  });
  vid.addEventListener('playing',()=>{$('bspin').classList.remove('show');clearTimeout(bufferingTimer);if(uRef)uRef.child('buffering').set(false);});
  vid.addEventListener('canplay',()=>{$('bspin').classList.remove('show');if(uRef)uRef.child('buffering').set(false);applyLastState();});
  vid.addEventListener('loadedmetadata',()=>{vidReady=true;applyLastState();});
  vid.addEventListener('timeupdate',updTime);
  vid.addEventListener('progress',updBuf);
  vid.addEventListener('play',()=>{if(!syncCd&&canCtrl())pushVid(true,false);updatePBtn(false);});
  vid.addEventListener('pause',()=>{if(!syncCd&&canCtrl())pushVid(false,false);updatePBtn(true);});

}

// APPLY VIDEO STATE
function applyVid(v,prev){
  if(!vidReady)return;
  const elapsed=Math.max(0,(nowS()-v.at)/1000);
  const target=v.time+(v.playing?elapsed*curSpd:0);
  const drift=Math.abs(vid.currentTime-target);

  // Show toast ONLY for intentional seek (seeked flag) by someone else
  if(prev&&v.by&&v.by!==me.name&&v.seeked){
    const timeDiff=Math.abs((prev.time||0)-v.time);
    if(timeDiff>3){
      toast(v.by+' → '+fmt(v.time)+'-ə çəkdi');
    }
  }
  // Show toast for play/pause by someone else
  if(prev&&v.by&&v.by!==me.name&&prev.playing!==v.playing){
    toast(v.by+' videoyu '+(v.playing?'▶ başlatdı':'⏸ dayandırdı'));
  }

  syncCd=true;
  if(drift>2)vid.currentTime=Math.max(0,Math.min(vid.duration||99999,target));
  if(v.playing&&vid.paused){
    const wm=vid.muted;vid.muted=true;
    vid.play().then(()=>setTimeout(()=>vid.muted=wm,300)).catch(()=>showTapToPlay());
    updatePBtn(false);
  } else if(!v.playing&&!vid.paused){
    vid.pause();updatePBtn(true);
  }

  const sb=$('sbadge');
  if(drift<1){sb.textContent='● CANLI';sb.className='sync-b';}
  else if(drift<4){sb.textContent='~'+drift.toFixed(0)+'s';sb.className='sync-b warn';}
  else{sb.textContent='SİNX...';sb.className='sync-b bad';}
  setTimeout(()=>syncCd=false,400);
}
function applyLastState(){if(lastDBState){vidReady=true;applyVid(lastDBState,null);}}

// pushVid — seeked flag yalnız manual seek-də true
function pushVid(playing,isSeek){
  if(!vRef)return;
  vRef.set({playing:playing??!vid.paused,time:vid.currentTime,at:nowS(),by:me.name,seeked:!!isSeek});
}

function togglePlay(){
  if(!canCtrl()){toast('Yalnız host/idarəçi idarə edə bilər');return;}

}
function skip(s){
  if(!canCtrl()){toast('Yalnız host/idarəçi idarə edə bilər');return;}
  const newT=Math.max(0,Math.min(vid.duration||0,vid.currentTime+s));
  vid.currentTime=newT;
  pushVid(!vid.paused,true);
  toast((s>0?'+':'')+s+'s → '+fmt(newT));
}
function updatePBtn(p){$('pico').innerHTML=p?'<path d="M8 5v14l11-7z"/>':'<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';}

function updBuf(){

function sendMsg(){
  if(chatMuted)return;
  const inp=$('cinp'),txt=inp.value.trim();if(!txt)return;
  cRef.push({name:me.name,id:me.id,host:me.host,mod:me.mod,text:txt,ts:Date.now()});

}
function appendMsg(m){
  const box=$('msgs'),d=document.createElement('div');
  const time=new Date(m.ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  const isMe=m.id===me.id;
  if(m.sys){
    d.className='msg-row sys';
    d.innerHTML=`<div class="sys-bubble">— ${esc(m.text)}</div>`;
  } else {
    d.className='msg-row '+(isMe?'me':'other');
    const nc=m.host?'cn-h':m.mod?'cn-m':'cn-u';
    const badge=m.host?' 👑':m.mod?' 🌟':'';
    const nameRow=isMe?'':`<div class="bubble-name ${nc}">${esc(m.name)}${badge}</div>`;
    d.innerHTML=`<div class="bubble">${nameRow}<div>${esc(m.text)}</div><div class="bubble-time">${time}</div></div>`;
    if(!isMe)chatNotif(m.name+': '+m.text.slice(0,35));
  }
  box.appendChild(d);box.scrollTop=box.scrollHeight;
}

const joinCode=urlParams.get('join');
if(joinCode&&joinCode.length>=5){$('j-code').value=joinCode.slice(0,5).toUpperCase();go('scr-join');}

// Kick detection
setInterval(()=>{
  if(!room.code||!me.id||me.host)return;
  DB.ref('rooms/'+room.code+'/users/'+me.id).get().then(s=>{
    if(room.code&&!s.exists()){toast('🚫 Siz otaqdan çıxarıldınız',4000);setTimeout(()=>{cleanup();go('scr-home');},1500);}
  });
},3000);
</script>
